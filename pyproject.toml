[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ledger-balance-tool"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.scripts]
ledger = "ledger.ui.main_window:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
